<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Misión Cerebro</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial;background:linear-gradient(160deg,#071a46,#281678 60%,#5720a1);color:#142f52;min-height:100vh}.hide{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.box{background:#fff;border-radius:30px;padding:34px;max-width:620px;width:100%;text-align:center;box-shadow:0 20px 60px #0005}.astro{font-size:58px}.box h1{font-size:42px;margin:15px 0}.box p{font-size:20px;line-height:1.4}.box input{display:block;width:100%;padding:20px;border:3px solid #d9e7f3;border-radius:18px;margin:15px 0;font-size:20px}.btn{border:0;border-radius:18px;padding:17px 24px;font-size:18px;font-weight:900;background:#ffd84d;color:#2381d8;cursor:pointer}.secondary{background:#17355b;color:#fff}.msg{min-height:28px;color:#b42318;font-weight:800;margin-top:14px}.top{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:14px 5%;background:#081b46;color:#fff}.brand{font-weight:1000;font-size:20px}.grow{flex:1}.pill{background:#ffffff18;padding:10px 14px;border-radius:18px;font-weight:800}.hero{padding:70px 6%;color:#fff;text-align:center}.hero h1{font-size:clamp(40px,8vw,78px);margin:0}.hero p{font-size:20px}.wrap{max-width:1050px;margin:auto;padding:25px}.panel{background:#fff;border-radius:24px;padding:25px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.planet,.mission,.answer{border:0;width:100%;text-align:left;border-radius:22px;padding:22px;background:#fff;box-shadow:0 8px 25px #0002;cursor:pointer;color:#153254}.planet .ico{font-size:48px}.planet b{font-size:22px}.mission{margin:8px 0;font-size:18px}.screen{max-width:900px;margin:auto;padding:30px}.card{background:#fff;border-radius:24px;padding:25px;margin:18px 0}.answer{margin:8px 0;background:#eef6ff;font-size:17px}.answer.good{background:#d8f7df}.answer.bad{background:#ffe0e0}.bar{height:14px;background:#e7edf4;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd84d}.logout{border:0;background:none;color:#fff;text-decoration:underline}.worldhead{color:#fff;text-align:center}.reading{font-size:19px;line-height:1.7}.small{font-size:14px;color:#567} @media(max-width:600px){.box{padding:26px 20px}.box h1{font-size:35px}.top{flex-wrap:wrap}.pill{font-size:13px}.hero{padding:45px 20px}}
</style></head><body>
<section id="login" class="login"><div class="box"><div class="astro">👨‍🚀</div><h1>Bienvenido a<br>Misión Cerebro</h1><p><b>Primera vez:</b> crea tu usuario y contraseña.</p><form id="createForm"><input id="newUser" autocomplete="username" placeholder="Nombre o usuario" required minlength="2"><input id="newPass" type="password" autocomplete="new-password" placeholder="Crea una contraseña" required minlength="4"><button class="btn" type="submit">Crear mi cuenta 🚀</button></form><div id="msg" class="msg"></div><hr><p><b>¿Ya tienes cuenta?</b></p><form id="loginForm"><input id="oldUser" autocomplete="username" placeholder="Nombre o usuario" required><input id="oldPass" type="password" autocomplete="current-password" placeholder="Contraseña" required><button class="btn secondary" type="submit">Entrar y continuar</button></form></div></section>
<section id="app" class="hide"><header class="top"><div class="brand">🚀 MISIÓN CEREBRO</div><div class="grow"></div><div class="pill">👨‍🚀 <span id="userTop"></span> <button class="logout" id="logout">Salir</button></div><div class="pill">⭐ <span id="xp">0</span> XP</div><div class="pill">🏆 <span id="done">0</span>/30</div></header><div id="home"><section class="hero"><h1>MISIÓN CEREBRO</h1><p>Lee · Piensa · Explora · Resuelve</p></section><main class="wrap"><div class="panel"><h2>🌌 Mapa Galáctico</h2><p>Elige un planeta y comienza tus actividades.</p><div id="planets" class="grid"></div></div><div class="panel"><h2>📡 Tu progreso</h2><div class="bar"><i id="bar" style="width:0"></i></div><p><b id="progress">0 de 30</b> actividades completadas.</p></div></main></div><div id="world" class="hide"><div class="screen"><button class="btn secondary" id="back">← Volver al mapa</button><div id="worldContent"></div></div></div></section>
<script>
(function(){
"use strict";
var WORLDS=[
["lectura","📖","Planeta Lectura"],["detective","🔎","Planeta Detective"],["logica","🧩","Planeta Lógica"],["decisiones","💡","Planeta Decisiones"],["final","🏆","Misión Final"]];
var TASKS=[
["lectura","La estación bajo la tormenta","Durante una tormenta, Mateo pensó que el viento había derribado la antena. Al revisarla, estaba firme. Después encontró una rama sobre el cable del radio. Al retirar la rama, la comunicación regresó.","¿Por qué cambió Mateo su explicación?",["Porque dejó de llover","Porque encontró nueva evidencia","Porque desapareció la antena","Porque alguien se lo ordenó"],1],
["lectura","El cuaderno de Elena","Elena comparó dos plantas iguales. Recibían la misma agua, pero una estaba junto a una ventana y otra en un rincón oscuro. Durante diez días midió ambas. La de la ventana creció más.","¿Qué variable fue diferente?",["El agua","La luz","La maceta","La hora"],1],
["lectura","El mensaje incompleto","Bruno leyó: “Si empieza a llover, recoge la ropa”. A las cinco vio nubes oscuras y sintió gotas. Guardó la ropa antes del aguacero.","¿Qué hizo Bruno?",["Ignoró las señales","Anticipó una consecuencia usando pistas","Esperó a que todo se mojara","Salió de casa"],1],
["lectura","La biblioteca","Una biblioteca amplió su horario. La encargada comparó las visitas con el mes anterior y encontró que aumentaron sobre todo por la tarde.","¿Cómo evaluó el cambio?",["Con rumores","Comparando registros","Mirando colores","Preguntando a una persona"],1],
["lectura","El puente","Un puente parecía normal, pero tenía un aviso de mantenimiento de los inspectores. La guía eligió otra ruta.","¿Por qué fue razonable?",["Porque consideró una advertencia relevante","Porque todos los puentes son malos","Porque era más divertido","Porque no sabía leer"],0],
["lectura","La fotografía","Sara recibió una foto sorprendente. Antes de compartirla buscó su origen y descubrió que era un montaje antiguo de un concurso.","¿Qué enseñanza deja?",["Compartir primero","Verificar origen y contexto","Creer lo emocionante","No mirar fotografías"],1],
["detective","La galleta perdida","Hay migas junto al plato y en el hocico del perro.","¿Qué hipótesis tiene más evidencia?",["La ventana la comió","El perro tomó la galleta","Desapareció sola","Nunca existió"],1],
["detective","La planta inclinada","Una planta crece hacia la ventana.","¿Qué prueba harías?",["Pintarla","Girar la maceta y observar","Cambiar el piso","Apagar el reloj"],1],
["detective","Huellas mojadas","Huellas mojadas van desde la puerta al baño.","¿Qué dato conviene revisar?",["Color del techo","Quién entró con zapatos mojados","Número de ventanas","Hora del recreo"],1],
["detective","La lámpara","Una lámpara no enciende, pero su foco funciona en otra.","¿Qué revisar?",["Enchufe y cable","Color del foco","Ventana","Reloj"],0],
["detective","Sonido nocturno","Se oye un golpe cada vez que arranca el aire acondicionado.","¿Qué probar primero?",["Vibración del equipo","La luna","Un fantasma","Un libro"],0],
["detective","El charco","Hay un charco bajo una botella con una grieta.","¿Qué explica mejor el agua?",["La botella gotea","El piso crea agua","La sombra","El ruido"],0],
["logica","Secuencia espacial","2, 4, 8, 16…","¿Qué sigue?",["18","24","32","34"],2],
["logica","Código de colores","Rojo, azul, rojo, azul, rojo…","¿Qué sigue?",["Verde","Azul","Rojo","Amarillo"],1],
["logica","Cajas de energía","Tres cajas tienen 5 baterías cada una y se usan 4.","¿Cuántas quedan?",["9","10","11","12"],2],
["logica","Planeta diferente","Mercurio, Venus, Tierra y Marte son rocosos; Júpiter es gigante gaseoso.","¿Cuál es diferente?",["Mercurio","Tierra","Marte","Júpiter"],3],
["logica","Clave numérica","1, 3, 5, 7…","¿Qué sigue?",["8","9","10","11"],1],
["logica","Reloj de misión","La nave sale a las 3:00 y viaja 2 horas.","¿A qué hora llega?",["4:00","5:00","6:00","7:00"],1],
["decisiones","Trabajo en equipo","Un compañero propone copiar una maqueta de Internet y decir que es propia.","¿Qué conviene?",["Copiar","Crear algo propio y repartir tareas","Ocultarla","No hacer nada"],1],
["decisiones","Dos fuentes","Una página no muestra fuentes y otra institución científica explica sus datos.","¿Qué conviene?",["Elegir la colorida","Comparar evidencia verificable","Creer la primera","No leer"],1],
["decisiones","El rumor","Dicen que mañana no hay clases, pero no hay aviso oficial.","¿Qué haces?",["Compartirlo","Verificar un canal oficial","Inventar una razón","Dar por cierto"],1],
["decisiones","El experimento","Quieres saber si más luz ayuda a crecer una planta.","¿Qué diseño sirve?",["Cambiar todo","Mantener lo demás y cambiar la luz","Preguntar a la planta","Cambiar varias cosas"],1],
["decisiones","El desacuerdo","Dos compañeros proponen formas distintas de ahorrar agua.","¿Cómo decidir?",["Por popularidad","Comparar evidencia y consecuencias","Por fuerza","Con una moneda"],1],
["decisiones","El error","Fallaste un acertijo y aparece una explicación.","¿Qué ayuda a aprender?",["Cerrar","Revisar y probar uno parecido","Memorizar una letra","Culpar al acertijo"],1],
["final","Base lunar","Hay 12 unidades de energía. Laboratorio usa 4, comunicaciones 3 y vehículo necesita 6.","¿Qué conclusión es correcta?",["Sobran 5","No alcanza para el vehículo","Hay 6 disponibles","Aumenta sola"],1],
["final","Mensaje desde Marte","Llegaron antes del amanecer; dos horas después comenzó una tormenta.","¿Qué está apoyado?",["Ya había tormenta","Comenzó después de llegar","Había nieve","Llovió antes"],1],
["final","Robot","El robot falla solo con cajas pesadas.","¿Qué prueba aporta más?",["Cambiar color","Probar distintos pesos y registrar","Apagar luces","Preguntarle"],1],
["final","Ruta estelar","Debes pasar por Luna antes que Marte y Marte antes que Zeta.","¿Qué ruta sirve?",["Marte→Luna→Zeta","Luna→Marte→Zeta","Zeta→Luna→Marte","Luna→Zeta→Marte"],1],
["final","Señal desconocida","Una señal se repite cada 10 segundos y el equipo revisa satélites y aparatos cercanos.","¿Qué habilidad usan?",["Adivinar","Descartar explicaciones con evidencia","Ignorar datos","Elegir lo emocionante"],1],
["final","Comandante","Plan A es rápido con pocos datos de seguridad; B tarda más y tiene pruebas y respaldo.","¿Qué comparar?",["Nombres","Seguridad, tiempo y consecuencias","Colores","Emoción"],1]];
function get(k){try{return localStorage.getItem(k)||""}catch(e){return""}}
function set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function profiles(){try{return JSON.parse(get("mcProfiles")||"{}")||{}}catch(e){return{}}}
var active="", P=profiles(), player=null;
var login=document.getElementById("login"),app=document.getElementById("app"),msg=document.getElementById("msg");
function showApp(){login.classList.add("hide");app.classList.remove("hide");document.getElementById("userTop").textContent=player.name;update();showHome()}
function showLogin(){login.classList.remove("hide");app.classList.add("hide")}
function save(){P[active]=player;set("mcProfiles",JSON.stringify(P));update()}
function update(){document.getElementById("xp").textContent=player.xp||0;document.getElementById("done").textContent=(player.done||[]).length;document.getElementById("progress").textContent=(player.done||[]).length+" de 30";document.getElementById("bar").style.width=((player.done||[]).length/30*100)+"%"}
document.getElementById("createForm").addEventListener("submit",function(e){e.preventDefault();msg.textContent="";var n=document.getElementById("newUser").value.trim(),p=document.getElementById("newPass").value;if(n.length<2){msg.textContent="Escribe un usuario de al menos 2 caracteres.";return}if(p.length<4){msg.textContent="La contraseña debe tener al menos 4 caracteres.";return}var id=n.toLowerCase();P=profiles();if(P[id]){msg.textContent="Ese usuario ya está en uso. Elige otro.";return}P[id]={name:n,password:p,xp:0,done:[],created:new Date().toISOString()};if(!set("mcProfiles",JSON.stringify(P))){msg.textContent="Safari no permitió guardar la cuenta. Abre esta página en una pestaña normal.";return}active=id;player=P[id];showApp()});
document.getElementById("loginForm").addEventListener("submit",function(e){e.preventDefault();var id=document.getElementById("oldUser").value.trim().toLowerCase(),p=document.getElementById("oldPass").value;P=profiles();if(!P[id]||P[id].password!==p){msg.textContent="Usuario o contraseña incorrectos.";return}active=id;player=P[id];showApp()});
document.getElementById("logout").onclick=function(){active="";player=null;document.getElementById("newUser").value="";document.getElementById("newPass").value="";document.getElementById("oldUser").value="";document.getElementById("oldPass").value="";showLogin()};
function renderPlanets(){document.getElementById("planets").innerHTML=WORLDS.map(function(w){return '<button type="button" class="planet" data-world="'+w[0]+'"><span class="ico">'+w[1]+'</span><br><b>'+w[2]+'</b><p>6 actividades</p></button>'}).join("");Array.prototype.forEach.call(document.querySelectorAll(".planet"),function(b){b.onclick=function(){openWorld(b.getAttribute("data-world"))}})}
function showHome(){document.getElementById("home").classList.remove("hide");document.getElementById("world").classList.add("hide");window.scrollTo(0,0)}
function openWorld(id){document.getElementById("home").classList.add("hide");document.getElementById("world").classList.remove("hide");var w=WORLDS.filter(function(x){return x[0]===id})[0],items=[];TASKS.forEach(function(t,i){if(t[0]===id)items.push([t,i])});document.getElementById("worldContent").innerHTML='<div class="worldhead"><h1>'+w[1]+' '+w[2]+'</h1></div><div class="card">'+items.map(function(x,k){return '<button type="button" class="mission" data-i="'+x[1]+'">'+((player.done||[]).indexOf(x[1])>=0?'✅ ':'🚀 ')+(k+1)+'. '+x[0][1])+'</button>'}).join("")+'</div>';Array.prototype.forEach.call(document.querySelectorAll(".mission"),function(b){b.onclick=function(){start(+b.getAttribute("data-i"))}});window.scrollTo(0,0)}
function start(i){i=Number(i);var t=TASKS[i];if(!t)return;document.getElementById("home").classList.add("hide");document.getElementById("world").classList.remove("hide");document.getElementById("worldContent").innerHTML='<div class="worldhead"><h1>'+t[1]+'</h1></div><div class="card '+(t[0]==="lectura"?"reading":"")+'"><h2>📚 Situación</h2><p>'+t[2]+'</p></div><div class="card"><h2>🧠 '+t[3]+'</h2><div id="answers">'+t[4].map(function(a,k){return '<button type="button" class="answer" data-a="'+k+'">'+String.fromCharCode(65+k)+') '+a+'</button>'}).join("")+'</div><div id="feedback"></div></div>';Array.prototype.forEach.call(document.querySelectorAll(".answer"),function(b){b.onclick=function(){answer(i,+b.getAttribute("data-a"))}});window.scrollTo(0,0)}
function answer(i,a){var t=TASKS[i],ok=a===t[5],buttons=document.querySelectorAll(".answer");Array.prototype.forEach.call(buttons,function(b,k){b.disabled=true;if(k===t[5])b.classList.add("good");if(k===a&&!ok)b.classList.add("bad")});if(ok&&(player.done||[]).indexOf(i)<0){player.done.push(i);player.xp=(player.xp||0)+(t[0]==="lectura"?30:20);save()}document.getElementById("feedback").innerHTML='<p><b>'+(ok?"🌟 ¡Correcto!":"🔎 Revisa la información e inténtalo de nuevo.")+'</b></p><button id="next" class="btn">'+(ok?"Continuar":"Reintentar")+'</button>';document.getElementById("next").onclick=function(){if(ok)openWorld(t[0]);else start(i)}}
document.getElementById("back").onclick=showHome;renderPlanets();
if(active&&P[active]){player=P[active];if(!Array.isArray(player.done))player.done=[];showApp()}else showLogin();
})();
</script></body></html>
