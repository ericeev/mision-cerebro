name: Fix interactive galaxy map
on:
  push:
    paths:
      - '.github/workflows/fix-galaxy-map.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace visible overlays with invisible hotspots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          start=s.index("/* MAPA GALÁCTICO — implementación única con recurso gráfico */")
          end=s.index("</style>", start)
          css="""/* MAPA GALÁCTICO — imagen maestra + zonas táctiles invisibles */
          #mapView{background:#010516!important}
          #mapView .wrap{max-width:709px!important;margin:0 auto!important;padding:0!important}
          .mapPanel{position:relative!important;overflow:hidden!important;width:100%!important;aspect-ratio:709/1536!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#010516 url('assets/05464A52-F6E7-438B-8975-55E67368AA7E.png') center top/100% 100% no-repeat!important;box-shadow:none!important}
          .mapPanel:before,.mapPanel:after,.mapTitle,.mapSub,.galaxy,.constellation,.astroMap,.shipMap,.missionHint{display:none!important}
          .planetGrid{position:absolute!important;z-index:5!important;inset:0!important;margin:0!important;padding:0!important;display:block!important}
          .planet{position:absolute!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;cursor:pointer!important;opacity:0!important;-webkit-tap-highlight-color:transparent!important}
          .planet:nth-child(1){left:4%!important;top:20%!important;width:43%!important;height:20%!important}
          .planet:nth-child(2){right:4%!important;top:20%!important;width:43%!important;height:20%!important}
          .planet:nth-child(3){left:2%!important;top:39%!important;width:43%!important;height:20%!important}
          .planet:nth-child(4){right:2%!important;top:39%!important;width:43%!important;height:20%!important}
          .planet:nth-child(5){left:27%!important;top:56%!important;width:46%!important;height:19%!important}
          .planet .worldBall,.planet .planetLabel{display:none!important}
          .planet:focus-visible{opacity:1!important;outline:3px solid #4eeaff!important;outline-offset:-3px!important}
          #mapView>.top{z-index:10}
          @media(max-width:600px){#mapView .wrap{padding:0!important}.mapPanel{width:100vw!important;max-width:100%!important}}
          """
          p.write_text(s[:start]+css+s[end:])
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hacer interactiva la imagen del mapa sin botones visibles"
          git push
