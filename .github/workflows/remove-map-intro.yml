name: Remove map intro
on:
  push:
    paths:
      - '.github/workflows/remove-map-intro.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          s=s.replace("#mapView{background:#010516!important}", "#mapView{background:#010516!important}\n#mapView>.hero{display:none!important}")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Eliminar cabecera superior duplicada del mapa"
          git push
